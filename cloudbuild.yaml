# ══════════════════════════════════════════════════════════════════════════════
# DenialDefender — Cloud Build CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
# Triggers automatically on push to main branch.
# Deploys all 3 services to Cloud Run:
#   1. denialdefender-web (Next.js frontend)
#   2. denialdefender-agents (Agent fleet)
#   3. trace-stream (Decision trace WebSocket)
#
# Setup:
#   gcloud builds triggers create github \
#     --repo-name=denialdefender \
#     --repo-owner=sodiq-code \
#     --branch-pattern="^main$" \
#     --build-config=cloudbuild.yaml
# ══════════════════════════════════════════════════════════════════════════════

steps:
  # ── Step 1: Build Next.js Web Service ──────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/denialdefender-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/denialdefender-web:latest'
      - '.'
    id: 'build-web'
    timeout: 600s

  # ── Step 2: Build Agent Fleet Service ──────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/denialdefender-agents:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/denialdefender-agents:latest'
      - './mini-services/agent-fleet'
    id: 'build-agents'
    timeout: 600s
    waitFor: ['-']  # Run in parallel with build-web

  # ── Step 3: Build Trace Stream Service ─────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/trace-stream:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/trace-stream:latest'
      - './mini-services/trace-stream'
    id: 'build-trace-stream'
    timeout: 600s
    waitFor: ['-']  # Run in parallel with build-web and build-agents

  # ── Step 4: Push all images ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/denialdefender-web:$COMMIT_SHA']
    id: 'push-web'
    waitFor: ['build-web']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/denialdefender-agents:$COMMIT_SHA']
    id: 'push-agents'
    waitFor: ['build-agents']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/trace-stream:$COMMIT_SHA']
    id: 'push-trace-stream'
    waitFor: ['build-trace-stream']

  # ── Step 5: Deploy Web Service to Cloud Run ────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'denialdefender-web'
      - '--image=gcr.io/$PROJECT_ID/denialdefender-web:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=2'
      - '--memory=1Gi'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--concurrency=80'
      - '--timeout=300'
      - '--service-account=json-775@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector=dd-vpc-connector'
      - '--vpc-egress=private-ranges-only'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=PORT=8080'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=GCP_REGION=europe-west1'
      - '--set-env-vars=FIRESTORE_LOCATION=eur3'
      - '--set-env-vars=NEXT_PUBLIC_GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=NEXT_PUBLIC_APP_NAME=DenialDefender'
      - '--set-env-vars=MEMORY_BANK_STORE=vertex_ai'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'
      - '--set-secrets=DATABASE_URL=cloud-sql-connection-string:latest'
    id: 'deploy-web'
    waitFor: ['push-web']

  # ── Step 6: Deploy Agent Fleet to Cloud Run ────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'denialdefender-agents'
      - '--image=gcr.io/$PROJECT_ID/denialdefender-agents:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--cpu=4'
      - '--memory=2Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=10'
      - '--timeout=600'
      - '--service-account=json-775@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector=dd-vpc-connector'
      - '--vpc-egress=private-ranges-only'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=GCP_REGION=europe-west1'
      - '--set-env-vars=FIRESTORE_LOCATION=eur3'
      - '--set-env-vars=PORT=8080'
      - '--set-env-vars=LOG_LEVEL=info'
      - '--set-env-vars=GEMINI_MODEL=gemini-3.5-flash'
      - '--set-env-vars=EMBEDDING_MODEL=text-embedding-004'
      - '--set-env-vars=EMBEDDING_DIMENSIONS=768'
      - '--set-env-vars=FORCE_LLM_BACKEND=gemini'
      - '--set-env-vars=MEMORY_BANK_STORE=vertex_ai'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'
      - '--set-secrets=DATABASE_URL=cloud-sql-connection-string:latest'
      - '--set-secrets=PHI_GUARD_CONFIG=phi-guard-config:latest'
    id: 'deploy-agents'
    waitFor: ['push-agents']

  # ── Step 7: Deploy Trace Stream to Cloud Run ───────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'trace-stream'
      - '--image=gcr.io/$PROJECT_ID/trace-stream:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--concurrency=80'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=PORT=8080'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=GCP_REGION=europe-west1'
    id: 'deploy-trace-stream'
    waitFor: ['push-trace-stream']

  # ── Step 8: Configure IAM & Pub/Sub ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Allow web service SA to invoke agent fleet
        gcloud run services add-iam-policy-binding denialdefender-agents \
          --member="serviceAccount:json-775@$PROJECT_ID.iam.gserviceaccount.com" \
          --role="roles/run.invoker" \
          --region=europe-west1 || echo "IAM binding may already exist"

        # Create/update Pub/Sub push subscription
        AGENT_URL=$(gcloud run services describe denialdefender-agents \
          --region=europe-west1 --format='value(status.url)')

        gcloud pubsub subscriptions create agent-tasks-push \
          --topic=agent_tasks \
          --push-endpoint="$${AGENT_URL}/pubsub/handle" \
          --push-auth-service-account=json-775@$PROJECT_ID.iam.gserviceaccount.com \
          2>/dev/null || echo "Subscription may already exist"

        echo "IAM and Pub/Sub configured"
    id: 'configure-iam-pubsub'
    waitFor: ['deploy-web', 'deploy-agents']

  # ── Step 9: Verify deployment ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "═══════════════════════════════════════════════════════════════"
        echo "  DenialDefender Deployment Complete!"
        echo "═══════════════════════════════════════════════════════════════"

        WEB_URL=$(gcloud run services describe denialdefender-web \
          --region=europe-west1 --format='value(status.url)')
        AGENT_URL=$(gcloud run services describe denialdefender-agents \
          --region=europe-west1 --format='value(status.url)')
        TRACE_URL=$(gcloud run services describe trace-stream \
          --region=europe-west1 --format='value(status.url)')

        echo "  Web:      $${WEB_URL}"
        echo "  Agents:   $${AGENT_URL}"
        echo "  Traces:   $${TRACE_URL}"
        echo "  Commit:   $COMMIT_SHA"
        echo ""

        # Health check
        echo "  Health check..."
        curl -sf "$${WEB_URL}/api/health" && echo "  ✓ Web healthy" || echo "  ✗ Web unhealthy"
    id: 'verify-deployment'
    waitFor: ['deploy-web', 'deploy-agents', 'deploy-trace-stream']

# ── Build options ────────────────────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1800s  # 30 minutes max
