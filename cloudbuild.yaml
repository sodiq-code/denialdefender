# ══════════════════════════════════════════════════════════════════════════════
# DenialDefender — Cloud Build CI/CD Pipeline
# ══════════════════════════════════════════════════════════════════════════════
# Deploys all 3 services to Cloud Run via Artifact Registry:
#   1. denialdefender-web (Next.js frontend)
#   2. denialdefender-agents (Agent fleet)
#   3. denialdefender-trace-stream (Decision trace WebSocket)
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml --project=denialdefender
# ══════════════════════════════════════════════════════════════════════════════

substitutions:
  _REGION: europe-west1
  _AR_HOST: europe-west1-docker.pkg.dev
  _AR_REPO: denialdefender
  _SERVICE_ACCOUNT: json-775@denialdefender.iam.gserviceaccount.com

steps:
  # ── Step 1: Build Next.js Web Service ──────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-web:$COMMIT_SHA'
      - '-t'
      - '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-web:latest'
      - '.'
    id: 'build-web'
    timeout: 600s

  # ── Step 2: Build Agent Fleet Service ──────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-agents:$COMMIT_SHA'
      - '-t'
      - '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-agents:latest'
      - './mini-services/agent-fleet'
    id: 'build-agents'
    timeout: 600s
    waitFor: ['-']

  # ── Step 3: Build Trace Stream Service ─────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-trace-stream:$COMMIT_SHA'
      - '-t'
      - '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-trace-stream:latest'
      - './mini-services/trace-stream'
    id: 'build-trace-stream'
    timeout: 600s
    waitFor: ['-']

  # ── Step 4: Push all images ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-web:$COMMIT_SHA']
    id: 'push-web'
    waitFor: ['build-web']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-agents:$COMMIT_SHA']
    id: 'push-agents'
    waitFor: ['build-agents']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-trace-stream:$COMMIT_SHA']
    id: 'push-trace-stream'
    waitFor: ['build-trace-stream']

  # ── Step 5: Deploy Web Service to Cloud Run ────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'denialdefender-web'
      - '--image=${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-web:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=2'
      - '--memory=1Gi'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--concurrency=80'
      - '--timeout=300'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=PORT=8080'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=GCP_REGION=${_REGION}'
      - '--set-env-vars=FIRESTORE_LOCATION=eur3'
      - '--set-env-vars=NEXT_PUBLIC_GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=NEXT_PUBLIC_APP_NAME=DenialDefender'
      - '--set-env-vars=MEMORY_BANK_STORE=vertex_ai'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key-1:latest'
    id: 'deploy-web'
    waitFor: ['push-web']

  # ── Step 6: Deploy Agent Fleet to Cloud Run ────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'denialdefender-agents'
      - '--image=${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-agents:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--cpu=4'
      - '--memory=2Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=10'
      - '--timeout=600'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=GCP_REGION=${_REGION}'
      - '--set-env-vars=FIRESTORE_LOCATION=eur3'
      - '--set-env-vars=PORT=8080'
      - '--set-env-vars=LOG_LEVEL=info'
      - '--set-env-vars=GEMINI_MODEL=gemini-3.5-flash'
      - '--set-env-vars=EMBEDDING_MODEL=text-embedding-004'
      - '--set-env-vars=EMBEDDING_DIMENSIONS=768'
      - '--set-env-vars=FORCE_LLM_BACKEND=gemini'
      - '--set-env-vars=MEMORY_BANK_STORE=vertex_ai'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key-1:latest'
    id: 'deploy-agents'
    waitFor: ['push-agents']

  # ── Step 7: Deploy Trace Stream to Cloud Run ───────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'denialdefender-trace-stream'
      - '--image=${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/denialdefender-trace-stream:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--concurrency=80'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=PORT=8080'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=GCP_REGION=${_REGION}'
    id: 'deploy-trace-stream'
    waitFor: ['push-trace-stream']

  # ── Step 8: Configure IAM for service-to-service auth ─────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services add-iam-policy-binding denialdefender-agents \
          --member="serviceAccount:${_SERVICE_ACCOUNT}" \
          --role="roles/run.invoker" \
          --region=${_REGION} 2>/dev/null || echo "IAM binding already exists"
        echo "IAM configured"
    id: 'configure-iam'
    waitFor: ['deploy-web', 'deploy-agents']

  # ── Step 9: Verify deployment ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== DenialDefender Deployment Complete ==="
        WEB_URL=$(gcloud run services describe denialdefender-web \
          --region=${_REGION} --format='value(status.url)')
        AGENT_URL=$(gcloud run services describe denialdefender-agents \
          --region=${_REGION} --format='value(status.url)')
        TRACE_URL=$(gcloud run services describe denialdefender-trace-stream \
          --region=${_REGION} --format='value(status.url)')
        echo "  Web:    $${WEB_URL}"
        echo "  Agents: $${AGENT_URL}"
        echo "  Traces: $${TRACE_URL}"
        echo "  Commit: $COMMIT_SHA"
        curl -sf "$${WEB_URL}/api/health" && echo "  Web: HEALTHY" || echo "  Web: UNHEALTHY"
    id: 'verify-deployment'
    waitFor: ['deploy-web', 'deploy-agents', 'deploy-trace-stream']

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1800s
