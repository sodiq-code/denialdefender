# ══════════════════════════════════════════════════════════════════════════════
# DenialDefender — Auto-Deploy to Cloud Run on Push to Main
# ══════════════════════════════════════════════════════════════════════════════
# Deploy order: agents + trace-stream FIRST → get their URLs → deploy web with URLs
#
# Setup:
#   1. Add these secrets to your GitHub repo (Settings > Secrets):
#      - GCP_PROJECT_ID: denialdefender
#      - GCP_SA_KEY: Service account JSON key
#      - TURSO_DB_URL: libsql://vaultwatch-sodiq-code.aws-us-east-1.turso.io
#      - TURSO_DB_TOKEN: Turso auth token
# ══════════════════════════════════════════════════════════════════════════════

name: Deploy to Cloud Run

on:
  # ⏸️ Deployment paused for faster pushes — re-enable by uncommenting push trigger
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: europe-west1
  AR_REPO: denialdefender

jobs:
  deploy:
    name: Build & Deploy All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Pre-flight: Check billing & enable ALL required APIs ────────────────
      - name: Pre-flight Check — Enable APIs & Verify Billing
        run: |
          echo "━━━ Pre-flight: Enabling Cloud Billing API first ━━━"
          gcloud services enable cloudbilling.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }} --quiet 2>/dev/null || true
          
          echo ""
          echo "━━━ Pre-flight: Checking billing status ━━━"
          BILLING_ENABLED=$(gcloud billing projects describe ${{ secrets.GCP_PROJECT_ID }} \
            --format="value(billingEnabled)" 2>/dev/null || echo "false")
          BILLING_ENABLED="${BILLING_ENABLED,,}"
          echo "  Billing enabled: ${BILLING_ENABLED}"
          
          if [ "${BILLING_ENABLED}" != "true" ]; then
            echo ""
            echo "❌ BILLING IS NOT ENABLED!"
            exit 1
          fi
          echo "✅ Billing is enabled"
          
          echo ""
          echo "━━━ Pre-flight: Enabling all required APIs ━━━"
          
          APIS=(
            "cloudbilling.googleapis.com"
            "run.googleapis.com"
            "cloudbuild.googleapis.com"
            "artifactregistry.googleapis.com"
            "firestore.googleapis.com"
            "sqladmin.googleapis.com"
            "pubsub.googleapis.com"
            "secretmanager.googleapis.com"
            "aiplatform.googleapis.com"
            "generativelanguage.googleapis.com"
            "iam.googleapis.com"
            "iamcredentials.googleapis.com"
            "cloudresourcemanager.googleapis.com"
            "serviceusage.googleapis.com"
            "vpcaccess.googleapis.com"
            "compute.googleapis.com"
            "cloudtrace.googleapis.com"
            "clouderrorreporting.googleapis.com"
            "logging.googleapis.com"
            "monitoring.googleapis.com"
          )
          
          FAILED_APIS=()
          for api in "${APIS[@]}"; do
            printf "  Enabling %-50s" "${api}"
            if gcloud services enable "${api}" --project=${{ secrets.GCP_PROJECT_ID }} --quiet 2>/dev/null; then
              printf " ✅\n"
            else
              printf " ⚠️\n"
              FAILED_APIS+=("${api}")
            fi
          done
          
          CRITICAL=("artifactregistry.googleapis.com" "run.googleapis.com" "secretmanager.googleapis.com")
          for api in "${CRITICAL[@]}"; do
            if [[ " ${FAILED_APIS[*]} " =~ " ${api} " ]]; then
              echo ""
              echo "❌ CRITICAL API ${api} failed to enable!"
              exit 1
            fi
          done
          
          echo "✅ All critical APIs enabled"

      # ── Create Artifact Registry repo if missing ───────────────────────────
      - name: Ensure Artifact Registry Repository Exists
        run: |
          if ! gcloud artifacts repositories describe ${{ env.AR_REPO }} \
            --location=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} 2>/dev/null | grep -q "name"; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create ${{ env.AR_REPO }} \
              --repository-format=docker \
              --location=${{ env.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --description="DenialDefender container images"
          else
            echo "Artifact Registry repository already exists"
          fi

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ── Build all 3 images ─────────────────────────────────────────────────
      - name: Build & Push Web Service
        run: |
          docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-web:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-web:latest .
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-web:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-web:latest

      - name: Build & Push Agent Fleet
        run: |
          docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-agents:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-agents:latest \
            ./mini-services/agent-fleet
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-agents:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-agents:latest

      - name: Build & Push Trace Stream
        run: |
          docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/trace-stream:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/trace-stream:latest \
            ./mini-services/trace-stream
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/trace-stream:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/trace-stream:latest

      # ── Deploy backend services FIRST (agents + trace-stream) ──────────────
      - name: Deploy Agent Fleet
        run: |
          gcloud run deploy denialdefender-agents \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-agents:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --no-allow-unauthenticated \
            --cpu=4 --memory=2Gi \
            --min-instances=0 --max-instances=10 \
            --concurrency=10 --timeout=600 \
            --service-account=json-775@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars=GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars=GCP_REGION=${{ env.GCP_REGION }} \
            --set-env-vars=DATABASE_URL=file:/tmp/production.db \
            --set-env-vars=TURSO_DB_URL=${{ secrets.TURSO_DB_URL }} \
            --set-env-vars=TURSO_DB_TOKEN=${{ secrets.TURSO_DB_TOKEN }} \
            --set-env-vars=FIRESTORE_LOCATION=eur3 \
            --set-env-vars=LOG_LEVEL=info \
            --set-env-vars=GEMINI_MODEL=gemini-3.5-flash \
            --set-env-vars=EMBEDDING_MODEL=text-embedding-004 \
            --set-env-vars=EMBEDDING_DIMENSIONS=768 \
            --set-env-vars=FORCE_LLM_BACKEND=gemini \
            --set-env-vars=MEMORY_BANK_STORE=vertex_ai \
            --set-secrets=GEMINI_API_KEY=gemini-api-key-1:latest \
            --quiet

      - name: Deploy Trace Stream
        run: |
          gcloud run deploy denialdefender-trace-stream \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/trace-stream:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --cpu=1 --memory=512Mi \
            --min-instances=0 --max-instances=2 \
            --concurrency=80 --timeout=300 \
            --set-env-vars=NODE_ENV=production \
            --set-env-vars=GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars=GCP_REGION=${{ env.GCP_REGION }} \
            --quiet

      # ── Get service URLs for web service env vars ─────────────────────────
      - name: Get Service URLs
        id: service-urls
        run: |
          AGENTS_URL=$(gcloud run services describe denialdefender-agents \
            --region=${{ env.GCP_REGION }} --format='value(status.url)')
          TRACE_URL=$(gcloud run services describe denialdefender-trace-stream \
            --region=${{ env.GCP_REGION }} --format='value(status.url)')
          
          echo "agents-url=${AGENTS_URL}" >> $GITHUB_OUTPUT
          echo "trace-url=${TRACE_URL}" >> $GITHUB_OUTPUT
          echo "✅ Agent Fleet URL: ${AGENTS_URL}"
          echo "✅ Trace Stream URL: ${TRACE_URL}"

      # ── Deploy web service LAST with service URLs ─────────────────────────
      - name: Deploy Web Service
        run: |
          gcloud run deploy denialdefender-web \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/denialdefender-web:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --cpu=2 --memory=1Gi \
            --min-instances=0 --max-instances=4 \
            --concurrency=80 --timeout=300 \
            --service-account=json-775@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars=NODE_ENV=production \
            --set-env-vars=DATABASE_URL=file:/tmp/production.db \
            --set-env-vars=TURSO_DB_URL=${{ secrets.TURSO_DB_URL }} \
            --set-env-vars=TURSO_DB_TOKEN=${{ secrets.TURSO_DB_TOKEN }} \
            --set-env-vars=GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars=GCP_REGION=${{ env.GCP_REGION }} \
            --set-env-vars=FIRESTORE_LOCATION=eur3 \
            --set-env-vars=AGENT_FLEET_URL=${{ steps.service-urls.outputs.agents-url }} \
            --set-env-vars=NEXT_PUBLIC_TRACE_STREAM_URL=${{ steps.service-urls.outputs.trace-url }} \
            --set-env-vars=NEXT_PUBLIC_GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars=NEXT_PUBLIC_APP_NAME=DenialDefender \
            --set-env-vars=MEMORY_BANK_STORE=vertex_ai \
            --set-secrets=GEMINI_API_KEY=gemini-api-key-1:latest \
            --quiet

      - name: Verify Deployment
        run: |
          WEB_URL=$(gcloud run services describe denialdefender-web \
            --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "✅ Web URL: $WEB_URL"
          echo "✅ Agent Fleet URL: ${{ steps.service-urls.outputs.agents-url }}"
          echo "✅ Trace Stream URL: ${{ steps.service-urls.outputs.trace-url }}"
          echo ""
          echo "Health checks..."
          sleep 10
          curl -sf "$WEB_URL/api/health" && echo " ✓ Web healthy" || echo " ⚠️ Web may need warm-up time"
