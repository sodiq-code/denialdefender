# DenialDefender Agent Fleet — Cloud Run Service (Python ADK)
# Deploy: gcloud run services replace agent-fleet-service.yaml
#
# This service runs the multi-agent Python fleet using Google ADK:
#   - Researcher Agent: Evidence retrieval + citation verification
#   - Drafter Agent: Appeal letter generation with provenance cards
#   - Reviewer Agent: Quality scoring + compliance checks
#   - PHI Guard Agent: PII/PHI detection + hashing
#   - Orchestrator: Routes tasks via Pub/Sub, manages HITL gates
#
# Invoked internally via Pub/Sub push subscriptions or direct HTTP from web service.
# NOT publicly accessible (no unauthenticated ingress).

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: denialdefender-agents
  namespace: project-8a09278a-5593-4289-b2e
  labels:
    app: denialdefender
    component: agent-fleet
    tier: backend
  annotations:
    # Internal-only — invoked by Pub/Sub push or web service
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        # Agent workloads are CPU-intensive (Gemini inference + embedding search)
        run.googleapis.com/cpu: "4"
        run.googleapis.com/memory: "2Gi"
        # Scale: 0→10 instances (agents are bursty, scale-to-zero saves cost)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # VPC connector for Cloud SQL pgvector access
        run.googleapis.com/vpc-access-connector: projects/project-8a09278a-5593-4289-b2e/locations/europe-west1/connectors/dd-vpc-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 10
      timeoutSeconds: 600
      serviceAccountName: denialdefender@project-8a09278a-5593-4289-b2e.iam.gserviceaccount.com
      containers:
      - name: agents
        image: gcr.io/project-8a09278a-5593-4289-b2e/denialdefender-agents:latest
        ports:
        - name: http1
          containerPort: 3004
        env:
        - name: GCP_PROJECT_ID
          value: project-8a09278a-5593-4289-b2e
        - name: GCP_REGION
          value: europe-west1
        - name: FIRESTORE_LOCATION
          value: eur3
        - name: AGENT_PORT
          value: "3004"
        - name: LOG_LEVEL
          value: info
        - name: GEMINI_MODEL
          value: gemini-2.0-flash
        - name: EMBEDDING_MODEL
          value: text-embedding-004
        - name: EMBEDDING_DIMENSIONS
          value: "768"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cloud-sql-connection-string
              key: latest
        - name: PHI_GUARD_CONFIG
          valueFrom:
            secretKeyRef:
              name: phi-guard-config
              key: latest
        resources:
          limits:
            cpu: "4"
            memory: 2Gi
        # Health check — agent fleet readiness
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
