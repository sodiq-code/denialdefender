# DenialDefender Agent Fleet — Cloud Run Service (TypeScript/Bun)
# Deploy: gcloud run services replace agent-fleet-service.yaml
#
# This service runs the multi-agent fleet (8 agents) that handle denial
# triage, evidence assembly, policy research, citation classification,
# letter drafting, and quality review.
#
# Invoked internally via direct HTTP from the web service (web → agents).
# NOT publicly accessible (internal ingress only).
#
# Project:    denialdefender (315133452553)
# Region:     europe-west1
# Provider:   GEMINI_PROVIDER=vertex_ai, ADK_FRAMEWORK=google-adk
# Model:      gemini-2.5-flash

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: denialdefender-agents
  namespace: denialdefender
  labels:
    app: denialdefender
    component: agent-fleet
    tier: backend
  annotations:
    # Internal-only — invoked by web service
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        # Agent workloads are CPU-intensive (Gemini inference + embedding search)
        run.googleapis.com/cpu: "4"
        run.googleapis.com/memory: "2Gi"
        # Scale 0 → 10 (agents are bursty; scale-to-zero saves cost)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # VPC connector for Cloud SQL pgvector access
        run.googleapis.com/vpc-access-connector: projects/denialdefender/locations/europe-west1/connectors/dd-vpc-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 10
      timeoutSeconds: 600
      serviceAccountName: dd-runtime@denialdefender.iam.gserviceaccount.com
      containers:
      - name: agents
        image: europe-west1-docker.pkg.dev/denialdefender/denialdefender/denialdefender-agents:latest
        ports:
        - name: http1
          containerPort: 3004
        env:
        - name: GCP_PROJECT_ID
          value: denialdefender
        - name: GCP_REGION
          value: europe-west1
        - name: FIRESTORE_LOCATION
          value: eur3
        # PORT is intentionally NOT set — the agent-fleet service hardcodes
        # port 3004 in index.ts (per task spec).
        - name: LOG_LEVEL
          value: info
        - name: GEMINI_MODEL
          value: gemini-2.5-flash
        - name: EMBEDDING_MODEL
          value: text-embedding-004
        - name: EMBEDDING_DIMENSIONS
          value: "768"
        # Force Gemini backend for all LLM calls
        - name: FORCE_LLM_BACKEND
          value: gemini
        # GEAP — LLM provider & ADK framework
        - name: GEMINI_PROVIDER
          value: vertex_ai
        - name: ADK_FRAMEWORK
          value: google-adk
        # GEAP — Model Armor safety shield
        - name: MODEL_ARMOR_POLICY_ID
          value: "dd-model-armor"
        - name: MODEL_ARMOR_LOCATION
          value: europe-west1
        # GEAP — Memory Bank (Vertex AI Reasoning Engine)
        - name: MEMORY_BANK_STORE
          value: vertex_ai
        # Secrets from Secret Manager
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
        resources:
          limits:
            cpu: "4"
            memory: 2Gi
        # Health check — agent fleet readiness (port 3004 hardcoded in index.ts)
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
